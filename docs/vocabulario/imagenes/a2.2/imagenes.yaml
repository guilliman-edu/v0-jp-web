# Imágenes de vocabulario — A2.2
# Lote s2 (2026-10-04): 120 términos, 91 con
# ilustración + 29 placeholder.
# Origen: escenas dibujadas a mano con la skill ilustrar-vocabulario y renderizadas
# con la caja de lápices Alpino (ADR-0091). No hay texto embebido en la imagen:
# la palabra la pone la ficha.
# Paleta ESTIMADA a partir de una carta de lápices común; pendiente de calibrar
# contra la foto de la caja real (no bloquea: si se reajusta, se re-tocan los hex).
# Estado de TODAS las entradas: propuesto — pendiente del gate humano por
# lección (ADR-0091 §4). Solo se versionan escena .json + .webp.
